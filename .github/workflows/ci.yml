name: ci
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest==8.3.3 httpx==0.27.2 -r api/requirements.txt
      - run: pytest -q tests
      - name: Validate docker-compose.yml
        run: docker compose config --quiet
