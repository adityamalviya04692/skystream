name: skystream

x-producer: &producer
  build: ./producers
  restart: unless-stopped
  depends_on:
    kafka-init: { condition: service_completed_successfully }
  environment: &producer-env
    KAFKA_BOOTSTRAP: kafka:9092
    CAPTURE_SECONDS: ${CAPTURE_SECONDS:-300}

services:
  kafka:
    image: apache/kafka:3.8.0
    ports: ["29092:29092"]          # localhost:29092 for tools running on your machine
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,HOST://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,HOST://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,HOST:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m
    volumes: [kafka-data:/var/lib/kafka/data]
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 10s
      retries: 12

  kafka-init:
    image: apache/kafka:3.8.0
    depends_on:
      kafka: { condition: service_healthy }
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        T="/opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists --replication-factor 1"
        $$T --topic raw.states --partitions 3 --config retention.ms=604800000
        $$T --topic raw.metar --partitions 1 --config retention.ms=604800000
        $$T --topic ref.aircraft --partitions 1 --config cleanup.policy=compact
        $$T --topic dlq --partitions 1 --config retention.ms=1209600000
        echo "topics ready"

  kafka-ui:
    image: provectuslabs/kafka-ui:v0.7.2
    ports: ["8081:8080"]
    depends_on:
      kafka: { condition: service_healthy }
    environment:
      KAFKA_CLUSTERS_0_NAME: skystream
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092

  postgres:
    image: postgres:16.4-alpine
    ports: ["5432:5432"]
    environment:
      POSTGRES_DB: skystream
      POSTGRES_USER: skystream
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-skystream}
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
      - ./reference:/reference:ro
      - pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U skystream -d skystream"]
      interval: 5s
      retries: 12

  opensky-producer:
    <<: *producer
    command: ["python", "opensky_producer.py"]
    environment:
      <<: *producer-env
      OPENSKY_CLIENT_ID: ${OPENSKY_CLIENT_ID:-}
      OPENSKY_CLIENT_SECRET: ${OPENSKY_CLIENT_SECRET:-}

  metar-producer:
    <<: *producer
    command: ["python", "metar_producer.py"]
    volumes: ["./reference:/reference:ro"]

  aircraft-loader:
    <<: *producer
    command: ["python", "aircraft_loader.py"]
    volumes: ["./data/aircraft:/data/aircraft"]

  spark:
    build: ./processing
    user: "0"                        # lets the job write to the named volumes
    restart: unless-stopped
    depends_on:
      kafka-init: { condition: service_completed_successfully }
      postgres: { condition: service_healthy }
    environment:
      KAFKA_BOOTSTRAP: kafka:9092
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-skystream}
      LAKE_PATH: /lake
    ports: ["4040:4040"]             # Spark UI
    volumes:
      - lake:/lake
      - ivy-cache:/tmp/.ivy2
      - ./reference:/reference:ro

  api:
    build: ./api
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      PGHOST: postgres
      PGPASSWORD: ${POSTGRES_PASSWORD:-skystream}
    ports: ["8000:8000"]             # also reachable at /api through the dashboard; docs at /docs

  dashboard:
    image: nginx:1.27-alpine
    ports: ["8080:80"]
    depends_on: [api]
    volumes:
      - ./mockup:/usr/share/nginx/html:ro
      - ./dashboard/nginx.conf:/etc/nginx/conf.d/default.conf:ro

volumes:
  kafka-data:
  pg-data:
  lake:
  ivy-cache:
